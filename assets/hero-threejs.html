<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Premium Hero · Three.js Particle Field</title>
<!-- 主题防闪烁：首屏同步读取偏好 -->
<script>
  (function () {
    try {
      var t = localStorage.getItem('theme');
      var sys = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var dark = t === 'dark' || (!t && sys);
      document.documentElement.classList.toggle('dark', dark);
    } catch (e) {}
  })();
</script>
<style>
  :root {
    --bg: #f7f8fa; --text: #0f1115; --text-muted: #5b6472;
    --accent: #10b981; --accent-2: #6366f1;
  }
  html.dark { --bg: #0a0b0f; --text: #eef1f6; --text-muted: #9aa3b2;
    --accent: #34d399; --accent-2: #818cf8; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Inter", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text);
    overflow: hidden; transition: background-color .3s ease, color .3s ease;
  }
  #hero-canvas { position: fixed; inset: 0; z-index: 0; }
  /* WebGL 不可用时的 CSS 渐变兜底 */
  #hero-fallback {
    position: fixed; inset: 0; z-index: 0; display: none;
    background: radial-gradient(circle at 30% 30%, var(--accent), transparent 45%),
                radial-gradient(circle at 70% 70%, var(--accent-2), transparent 45%),
                var(--bg);
  }
  .overlay {
    position: relative; z-index: 1; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
  }
  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 14px; border-radius: 999px; font-size: 14px;
    background: color-mix(in srgb, var(--text) 8%, transparent);
    border: 1px solid color-mix(in srgb, var(--text) 14%, transparent);
    backdrop-filter: blur(12px); margin-bottom: 24px;
  }
  h1 {
    font-size: clamp(2.2rem, 6vw, 4rem); line-height: 1.1; letter-spacing: -0.02em;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  p.sub { margin-top: 16px; font-size: clamp(1rem, 2vw, 1.25rem);
    color: var(--text-muted); max-width: 640px; }
  .cta {
    margin-top: 36px; display: inline-flex; gap: 12px; align-items: center;
    padding: 14px 28px; border-radius: 12px; border: none; cursor: pointer;
    font-size: 16px; font-weight: 600; color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 8px 30px color-mix(in srgb, var(--accent) 40%, transparent);
    transition: transform .3s cubic-bezier(.16,1,.3,1);
  }
  .cta:hover { transform: scale(1.05) translateY(-2px); }
  .theme-btn {
    position: fixed; top: 20px; right: 20px; z-index: 2;
    width: 44px; height: 44px; border-radius: 999px; cursor: pointer;
    border: 1px solid color-mix(in srgb, var(--text) 14%, transparent);
    background: color-mix(in srgb, var(--text) 8%, transparent);
    backdrop-filter: blur(12px); color: var(--text); font-size: 18px;
  }
  @media (prefers-reduced-motion: reduce) {
    .cta { transition: none; }
  }
</style>
</head>
<body>
  <div id="hero-fallback"></div>
  <div id="hero-canvas"></div>

  <button class="theme-btn" id="themeBtn" title="切换主题">🌓</button>

  <div class="overlay">
    <span class="badge">✦ Premium Full-Stack · 吴八哥 Studio</span>
    <h1>打造像素级奢华体验</h1>
    <p class="sub">Laravel · Livewire · FluxUI · 高级 CSS · Three.js —— 动效与性能并存的现代全栈实现。</p>
    <button class="cta">立即开始 →</button>
  </div>

  <!-- Three.js（CDN，ESM importmap） -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">
    const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const fallback = document.getElementById('hero-fallback');
    const mount = document.getElementById('hero-canvas');

    let renderer, scene, camera, points, raf, clock;
    const reduceMotion = prefersReduced;

    function webglAvailable() {
      try {
        const c = document.createElement('canvas');
        return !!(window.WebGLRenderingContext &&
          (c.getContext('webgl') || c.getContext('experimental-webgl')));
      } catch (e) { return false; }
    }

    async function init() {
      if (!webglAvailable()) { fallback.style.display = 'block'; return; }
      let THREE;
      try { THREE = await import('three'); }
      catch (e) { fallback.style.display = 'block'; return; }

      const isMobile = window.innerWidth < 768;
      const COUNT = isMobile ? 1200 : 3500;

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1000);
      camera.position.z = 60;

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      mount.appendChild(renderer.domElement);

      const positions = new Float32Array(COUNT * 3);
      for (let i = 0; i < COUNT * 3; i++) positions[i] = (Math.random() - 0.5) * 200;
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

      const isDark = document.documentElement.classList.contains('dark');
      const mat = new THREE.PointsMaterial({
        size: 0.7,
        color: new THREE.Color(isDark ? 0x34d399 : 0x10b981),
        transparent: true, opacity: 0.9,
        blending: THREE.AdditiveBlending, depthWrite: false
      });
      points = new THREE.Points(geo, mat);
      scene.add(points);

      clock = new THREE.Clock();

      // 离屏暂停渲染，省电省 GPU
      const io = new IntersectionObserver((entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting) start(); else stop();
        });
      });
      io.observe(mount);

      window.addEventListener('resize', onResize);
      start();
    }

    function onResize() {
      if (!renderer) return;
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    }

    function animate() {
      raf = requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      if (!reduceMotion) {
        points.rotation.y = t * 0.05;
        points.rotation.x = Math.sin(t * 0.1) * 0.1;
      }
      renderer.render(scene, camera);
    }
    function start() { if (!raf) animate(); }
    function stop() { if (raf) { cancelAnimationFrame(raf); raf = null; } }

    init();

    // 主题切换（与 premium-theme.css 约定一致）
    document.getElementById('themeBtn').addEventListener('click', () => {
      const dark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', dark ? 'dark' : 'light');
      if (points) {
        const c = dark ? 0x34d399 : 0x10b981;
        points.material.color.setHex(c);
      }
    });
  </script>
</body>
</html>
